<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toastmasters Time Keeper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->

        <header class="header">

            <div class="header-top">

                <div class="header-title">

                    <div class="eyebrow">
                        Toastmasters Tools
                    </div>

                    <h1>
                        Time Keeper
                    </h1>

                    <p class="subtitle">
                        Keep every speech on time.
                    </p>

                </div>


                <!-- Top-right controls -->

                <div class="header-controls">

                    <!-- Sound -->

                    <button
                        type="button"
                        class="header-control active"
                        id="sound-toggle"
                        aria-pressed="true"
                        title="Toggle sound alerts">

                        <span
                            id="sound-icon"
                            aria-hidden="true">
                            🔊
                        </span>

                        <span class="control-label">
                            Sound
                        </span>

                    </button>


                    <!-- Vibration -->

                    <button
                        type="button"
                        class="header-control active"
                        id="vibration-toggle"
                        aria-pressed="true"
                        title="Toggle vibration alerts">

                        <span
                            id="vibration-icon"
                            aria-hidden="true">
                            📳
                        </span>

                        <span class="control-label">
                            Vibration
                        </span>

                    </button>


                    <!-- Theme -->

                    <button
                        type="button"
                        class="header-control"
                        id="theme-toggle"
                        aria-label="Switch to dark mode"
                        title="Change appearance">

                        <span
                            id="theme-icon"
                            aria-hidden="true">
                            ☀︎
                        </span>

                        <span
                            class="control-label"
                            id="theme-label">
                            Light
                        </span>

                    </button>

                </div>

            </div>

        </header>


        <!-- Main timer card -->

        <section class="timer-card">


            <!-- Speech type -->

            <nav
                class="timing-tabs"
                aria-label="Speech timing">

                <button
                    type="button"
                    class="timing-tab"
                    data-type="Table Topics">

                    Table Topics

                </button>


                <button
                    type="button"
                    class="timing-tab"
                    data-type="Ice Breaker">

                    Ice Breaker

                </button>


                <button
                    type="button"
                    class="timing-tab active"
                    data-type="Other Speech">

                    Other Speech

                </button>


                <button
                    type="button"
                    class="timing-tab"
                    data-type="Evaluation">

                    Evaluation

                </button>


                <button
                    type="button"
                    class="timing-tab"
                    data-type="General Evaluator">

                    General Evaluator

                </button>

            </nav>


            <!-- Timer -->

            <div class="timer-section">

                <div
                    class="timer"
                    id="timer"
                    aria-live="polite">

                    00:00

                </div>


                <div
                    class="status"
                    id="status"
                    aria-live="polite">

                    Ready to start

                </div>

            </div>


            <!-- Controls -->

            <div class="buttons">


                <div class="main-buttons">

                    <button
                        type="button"
                        class="start"
                        id="start">

                        Start

                    </button>


                    <button
                        type="button"
                        class="reset"
                        id="reset">

                        Reset

                    </button>

                </div>


                <!-- Speaker test -->

                <button
                    type="button"
                    class="sound-test"
                    id="sound-test"
                    title="Test alert sound">

                    <span aria-hidden="true">
                        🔊
                    </span>

                    Test

                </button>

            </div>


            <!-- Timing reference -->

            <div class="timing-reference">


                <!-- Green -->

                <div class="timing-item green">

                    <span
                        class="timing-dot"
                        aria-hidden="true">
                    </span>

                    <div>

                        <strong>
                            Green
                        </strong>

                        <span id="green-time">
                            05:00
                        </span>

                    </div>

                </div>


                <!-- Yellow -->

                <div class="timing-item yellow">

                    <span
                        class="timing-dot"
                        aria-hidden="true">
                    </span>

                    <div>

                        <strong>
                            Yellow
                        </strong>

                        <span id="yellow-time">
                            06:00
                        </span>

                    </div>

                </div>


                <!-- Red -->

                <div class="timing-item red">

                    <span
                        class="timing-dot"
                        aria-hidden="true">
                    </span>

                    <div>

                        <strong>
                            Red
                        </strong>

                        <span id="red-time">
                            07:00
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- Signature -->

<!-- Signature -->

    <footer>
    <span>Designed & built by</span>

    <strong>Hari Arayakeel</strong>

    <a
    class="linkedin-link"
    href="https://www.linkedin.com/in/hari-arayakeel/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="LinkedIn profile">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-linkedin"
            viewBox="0 0 16 16">

            <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-1.232.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"/>
        </svg>

    </a>
</footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
